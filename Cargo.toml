[package]
name = "hoshino"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = false

[[bin]]
name = "hoshino"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
crossterm = "=0.29.0"
git2 = { version = "=0.21.0", default-features = false, features = ["vendored-libgit2"] }
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ignore = "=0.4.33"
jiff = "=0.2.37"
quick-xml = "=0.42.0"
ratatui = { version = "=0.30.1", default-features = false, features = ["crossterm"] }
ratatui-image = { version = "=11.0.8", default-features = false, features = ["crossterm"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sysinfo = { version = "=0.39.6", default-features = false, features = ["disk", "system"] }
toml = "=1.1.6"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"
